apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-gateway
  namespace: attendance-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: access-gateway
  template:
    metadata:
      labels:
        app: access-gateway
    spec:
      containers:
        - name: access-gateway
          image: access-gateway:latest
          env:
            - name: UPSTREAM_URL
              value: "http://your-upstream-service:3000"
            - name: PORT
              value: "4000"
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: access-gateway
  namespace: attendance-sync
spec:
  selector:
    app: access-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
