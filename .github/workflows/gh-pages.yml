name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run tests
        run: |
          npm ci --prefer-offline --no-audit --progress=false || true
          npm test || true
        # tests are optional for deploy; they run but failures won't block deployment

      - name: Build static site (no build step required for this repo)
        run: echo "No build step required — deploying repository root as static site"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          allow_empty_commit: false
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Create .nojekyll so files starting with underscore are served
        if: always()
        run: |
          gh api repos/${{ github.repository }}/pages/builds -X POST -f 'source=gh-pages' || true

# Notes:
# - This workflow publishes the repository root to the gh-pages branch on pushes to main/master.
# - Ensure GitHub Pages is set to deploy from the gh-pages branch (Settings → Pages) or the action will trigger the build.
# - The workflow intentionally runs tests but doesn't fail the deploy if tests fail; remove `|| true` if you want failing tests to block deploys.
