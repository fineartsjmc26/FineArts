name: Terraform Load Balancer

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to run Terraform for (aws|gcp|azure)'
        required: true
        default: 'aws'
      action:
        description: 'terraform action (plan|apply)'
        required: true
        default: 'plan'

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Select provider folder
        id: folder
        run: |
          echo "folder=infra/load-balancers/${{ github.event.inputs.provider }}" >> $GITHUB_OUTPUT

      - name: Configure provider credentials (AWS)
        if: ${{ github.event.inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure provider credentials (GCP)
        if: ${{ github.event.inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure provider credentials (Azure)
        if: ${{ github.event.inputs.provider == 'azure' }}
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ${{ steps.folder.outputs.folder }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ steps.folder.outputs.folder }}
        run: terraform validate || true

      - name: Terraform Plan
        working-directory: ${{ steps.folder.outputs.folder }}
        run: terraform plan -input=false -out=tfplan || true

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: ${{ steps.folder.outputs.folder }}
        run: terraform apply -input=false -auto-approve tfplan
