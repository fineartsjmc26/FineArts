<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Component Reference — Attendance App</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <style>
    :root{ --gap: 16px; }
    body{ font-family: Inter, system-ui, sans-serif; background: var(--bg-base); color: var(--text-primary); padding: 32px; }
    .topbar{ display:flex; gap:12px; align-items:center; margin-bottom:24px; }
    .panel{ background:var(--bg-surface); border:1px solid var(--border-subtle); padding:16px; border-radius:12px; box-shadow: var(--shadow-sm); }
    .row{ display:flex; gap:16px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    h1{ margin:0 0 8px 0; }
    .col{ width:320px; }
    .btn{ padding:8px 14px; border-radius:8px; border:1px solid transparent; cursor:pointer; }
    .btn.primary{ background:var(--accent); color:var(--text-on-accent); }
    .btn.secondary{ background:transparent; color:var(--text-primary); border:1px solid var(--border-subtle); }
    input, select { padding:10px; border-radius:8px; border:1px solid var(--border-strong); background:var(--bg-surface); color:var(--text-primary); }
    .card{ padding:16px; border-radius:12px; background:var(--bg-surface); border:1px solid var(--border-subtle); }
    table{ width:100%; border-collapse:collapse; }
    th, td{ padding:8px; border-bottom:1px solid var(--border-subtle); }
    .chip{ display:inline-flex; padding:6px 10px; border-radius:999px; border:1px solid var(--border-strong); background:var(--bg-surface-alt); }
    .kbd{ font-family: var(--font-mono, monospace); background:var(--bg-surface-alt); padding:4px 8px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Component Reference</h1>
    <label for="themeSelect">Theme:</label>
    <select id="themeSelect">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <section class="panel">
    <h2>Buttons</h2>
    <div class="row">
      <button class="btn primary">Primary</button>
      <button class="btn secondary">Secondary</button>
      <button class="btn" disabled>Disabled</button>
    </div>
    <h3>Sizes</h3>
    <div class="row">
      <button class="btn primary" style="padding:6px 10px;">Small</button>
      <button class="btn primary" style="padding:12px 18px;">Default</button>
      <button class="btn primary" style="padding:16px 22px;">Large</button>
    </div>
  </section>

  <section class="panel" style="margin-top:16px;">
    <h2>Forms</h2>
    <div class="row">
      <div class="col">
        <label>Text input</label><br>
        <input placeholder="Type here" />
      </div>
      <div class="col">
        <label>Select</label><br>
        <select><option>Option A</option><option>Option B</option></select>
      </div>
    </div>
  </section>

  <section class="panel" style="margin-top:16px;">
    <h2>Cards & Lists</h2>
    <div class="row">
      <div class="card col">
        <strong>Card title</strong>
        <p style="color:var(--text-secondary);">This is a card demonstrating surface, border, and spacing tokens.</p>
        <div style="margin-top:12px;"><span class="chip">Present</span> <span class="chip">Absent</span></div>
      </div>
      <div class="col">
        <table>
          <thead><tr><th>Header</th><th>Header 2</th></tr></thead>
          <tbody>
            <tr><td>Row A</td><td>Value</td></tr>
            <tr><td>Row B</td><td>Value</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    // Simple theme wiring for the reference page — mirrors theme-toggle.js
    const STORAGE_KEY = 'attendance-studio-theme';
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const sel = document.getElementById('themeSelect');
    function getStored(){ try{ return localStorage.getItem(STORAGE_KEY);}catch(e){return null;} }
    function store(v){ try{ if(v==='system') localStorage.removeItem(STORAGE_KEY); else localStorage.setItem(STORAGE_KEY, v);}catch(e){} }
    function apply(v){ const effective = v==='system' ? (media.matches ? 'dark' : 'light') : v; if(effective==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); }
    const initial = getStored() || 'system'; sel.value = initial; apply(initial);
    sel.addEventListener('change', ()=>{ store(sel.value); apply(sel.value); });
    media.addEventListener('change', ()=>{ if(!getStored()) apply('system'); });
  </script>
</body>
</html>
