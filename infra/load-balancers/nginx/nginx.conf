# ---------------------------------------------------------------------------
# nginx reverse proxy / local load balancer
# Fronts multiple local "firebase serve" (or static server) instances.
#
# Usage (development only):
#   1. Start N app instances:
#        firebase serve --port 5000
#        firebase serve --port 5001
#        ...
#   2. nginx -c <abs path to this file>
#   3. Open http://localhost:8080 -> load balanced across the instances
# ---------------------------------------------------------------------------
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream attendance_backends {
        # Round-robin across the local app instances.
        server 127.0.0.1:5000;
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;

        # Optionally weight one instance higher:
        # server 127.0.0.1:5000 weight=3;

        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://attendance_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Simple health check endpoint
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}