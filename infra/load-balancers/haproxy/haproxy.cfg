global
    log /dev/log local0
    maxconn 2000
    user haproxy
    group haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http_front
    bind *:80
    default_backend attendance_back

backend attendance_back
    balance roundrobin
    option httpchk GET /_health
    server node1 10.0.0.10:80 check
    server node2 10.0.0.11:80 check

# Optional stats page (enable with proper auth in production)
listen stats
    bind *:9000
    mode http
    stats enable
    stats uri /_haproxy_stats
    stats refresh 10s
